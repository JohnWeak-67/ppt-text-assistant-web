<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Space Scaning Master</title>
  <link rel="stylesheet" href="taskpane.css" />
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
  <header class="app-header">
    <img class="brand-logo" src="ssm-logo.png" alt="SSM Logo" />
    <div class="brand-text">
      <h1>Space Scaning Master</h1>
      <p id="doc-name" class="muted">—</p>
    </div>
  </header>

  <section class="tool-section">
    <div class="section-heading">
  <span class="section-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M4 18L9 6L14 18" />
      <path d="M6 13H12" />
      <path d="M16 8H21" />
      <path d="M18.5 8V18" />
    </svg>
  </span>
  <h2>标题转换</h2>
</div>
    <p id="sel-status" class="status">未选中文本</p>
    <div id="preview" class="preview">选中文本后这里显示转换预览</div>
    <button id="btn-convert" disabled>转换标题</button>
  </section>

  <section class="tool-section">
    <div class="section-heading">
  <span class="section-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none">
      <circle cx="10.5" cy="10.5" r="6.2" />
      <path d="M15.2 15.2L19.7 19.7" />
      <path d="M8.2 10.5H12.8" />
    </svg>
  </span>
  <h2>空格扫描</h2>
</div>
    <div class="row">
      <button id="btn-scan">扫描当前 PPT</button>
      <button id="btn-clear" class="ghost">清空</button>
    </div>
    <p id="scan-summary" class="status"></p>
    <ul id="issues" class="issues"></ul>
  </section>

  <script src="taskpane.js"></script>
</body>
</html>
